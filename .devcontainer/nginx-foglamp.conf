server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Document root - where FogLAMP GUI files are located
    root /var/www/html;

    # Index files
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    # Basic location for static files - this configuration works without infinite redirect loops
    location / {
        # First attempt to serve request as file, then as directory, then fall back to displaying a 404.
        # NOTE: This prevents the infinite redirect loops that occurred with try_files $uri $uri/ /index.html
        try_files $uri $uri/ =404;
    }

    # Health check endpoint for monitoring
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy FogLAMP API calls to the backend service
    location /foglamp/ {
        proxy_pass http://127.0.0.1:8081/foglamp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS for browser-based API calls
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}